name: Docker Build

on:
  push:
    branches: [ "master" ]
    # Version tags don't build here. A release adds the version tag to an
    # image already built (see release.yml) and never moves :latest.
  pull_request:
    branches: [ "master" ]
  # Manual trigger for re-running a build without a code change (e.g.
  # registry hiccup, or wanting to re-publish :latest at the current
  # HEAD).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Publishes ghcr.io/edgy-solutions/openddil/logistics-sim:latest, which the
# openddil-helm chart's logisticsSim.image refers to. Same flow the other
# openddil-* Python services use (cm-service, asset-registry-service,
# logistics-fusion-service). `${{ github.repository_owner }}` resolves to
# the owning org/user so the workflow stays portable across forks.

jobs:
  build-logistics-sim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :sha-<7> always, :pr-<N> on a pull request, :<tag> on a v* tag;
      # :latest only from master.
      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REG=ghcr.io/${{ github.repository_owner }}/openddil/logistics-sim
          T="$REG:sha-${HEAD_SHA:0:7}"
          if [ -n "$PR_NUMBER" ]; then
            T="$T,$REG:pr-$PR_NUMBER"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$T,$REG:$GITHUB_REF_NAME"
          fi
          if [ "$GITHUB_REF" = "refs/heads/master" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            T="$T,$REG:latest"
          fi
          echo "tags=$T" >> "$GITHUB_OUTPUT"

      - name: Build logistics-sim
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.tags.outputs.tags }}
